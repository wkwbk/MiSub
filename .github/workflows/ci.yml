name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static lint
        run: pnpm exec oxlint --deny-warnings

      - name: Run unit tests
        run: pnpm test

      - name: Build production frontend bundle
        run: pnpm build

      - name: Verify Cloudflare Pages Functions & Worker bundles
        run: |
          pnpm exec wrangler pages functions build --outdir=.wrangler/pages-build --compatibility-date=2025-11-01 --compatibility-flag=nodejs_compat
          pnpm exec wrangler deploy --dry-run --outdir=.wrangler/worker-build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E smoke tests
        run: pnpm exec playwright test
