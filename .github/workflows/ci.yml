name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static lint
        run: pnpm exec oxlint --deny-warnings

      - name: Run TypeScript type check
        run: |
          pnpm exec tsc --noEmit
          pnpm exec vue-tsc --noEmit

      - name: Run unit tests
        run: pnpm test

      - name: Build production frontend bundle
        run: pnpm build

      - name: Verify Cloudflare Pages Functions & Worker bundles
        run: |
          pnpm exec wrangler pages functions build --outdir=.wrangler/pages-build --compatibility-date=2025-11-01 --compatibility-flag=nodejs_compat
          pnpm exec wrangler deploy --dry-run --outdir=.wrangler/worker-build

      - name: Cache Playwright browsers
        if: github.ref != 'refs/heads/main'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: github.ref != 'refs/heads/main'
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            pnpm exec playwright install --with-deps chromium
          else
            pnpm exec playwright install-deps chromium
          fi

      - name: Run Playwright E2E smoke tests
        if: github.ref != 'refs/heads/main'
        run: pnpm exec playwright test
